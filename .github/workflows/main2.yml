name: Pick Weekly Game

on:
  schedule:
    # 7:00 AM PKT is 02:00 AM UTC
    - cron: '0 2 * * 1'
  workflow_dispatch:

jobs:
  pick-game:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: |
          npm install firebase-admin discord.js
          pip install Pillow

      - name: Select top-voted game, Discord, outreach package
        env:
          APP_ID: ${{ vars.APP_ID }}
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_FORUM_CHANNEL_ID: ${{ secrets.DISCORD_FORUM_CHANNEL_ID }}
          DEV_CLUB_ROLE_ID: ${{ secrets.DEV_CLUB_ROLE_ID }}
          DISCORD_ANNOUNCE_CHANNEL_ID: ${{ secrets.DISCORD_ANNOUNCE_CHANNEL_ID }}
        run: node scripts/pick-weekly-game.js

      - name: Post to Bluesky
        env:
          BLUESKY_HANDLE: ${{ secrets.BLUESKY_HANDLE }}
          BLUESKY_APP_PASSWORD: ${{ secrets.BLUESKY_APP_PASSWORD }}
        run: node scripts/post-bluesky.js
        continue-on-error: true

      - name: Post to LinkedIn
        env:
          LINKEDIN_ORGANIZATION_ID: ${{ secrets.LINKEDIN_ORGANIZATION_ID }}
          LINKEDIN_ACCESS_TOKEN: ${{ secrets.LINKEDIN_ACCESS_TOKEN }}
          LINKEDIN_REFRESH_TOKEN: ${{ secrets.LINKEDIN_REFRESH_TOKEN }}
          LINKEDIN_CLIENT_ID: ${{ secrets.LINKEDIN_CLIENT_ID }}
          LINKEDIN_CLIENT_SECRET: ${{ secrets.LINKEDIN_CLIENT_SECRET }}
        run: node scripts/post-linkedin.js
        continue-on-error: true

      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: 'chore: weekly club outreach package'
          file_pattern: |
            reddit-auto-post/post.json
            outreach/weekly.md
            outreach/bluesky.json
            outreach/linkedin.json
            outreach/weekly-cover.png
            .github/workflows/current_thread_id
