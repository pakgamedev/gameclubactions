<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Game Club share kit | PakGameDev</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #0b1220;
      --panel: #121a2b;
      --line: rgba(34, 197, 94, 0.28);
      --text: #e8eef8;
      --muted: #93a4bf;
      --green: #22c55e;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: Rajdhani, system-ui, sans-serif;
      color: var(--text);
      background:
        radial-gradient(900px 500px at 10% -10%, rgba(34, 197, 94, 0.18), transparent 55%),
        radial-gradient(700px 400px at 100% 0%, rgba(56, 189, 248, 0.1), transparent 50%),
        var(--bg);
    }
    main {
      width: min(980px, calc(100% - 2rem));
      margin: 0 auto;
      padding: 1.5rem 0 3rem;
    }
    header {
      display: flex;
      flex-wrap: wrap;
      gap: 0.75rem 1.25rem;
      align-items: end;
      justify-content: space-between;
      margin-bottom: 1.25rem;
    }
    h1 {
      margin: 0;
      font-size: clamp(1.8rem, 4vw, 2.6rem);
      letter-spacing: 0.04em;
      text-transform: uppercase;
      line-height: 1;
    }
    .sub {
      margin: 0.35rem 0 0;
      color: var(--muted);
      font-family: "IBM Plex Mono", monospace;
      font-size: 0.85rem;
    }
    .grid {
      display: grid;
      grid-template-columns: minmax(220px, 340px) 1fr;
      gap: 1.25rem;
      align-items: start;
    }
    @media (max-width: 820px) {
      .grid { grid-template-columns: 1fr; }
    }
    .panel {
      background: color-mix(in srgb, var(--panel) 92%, black);
      border: 1px solid var(--line);
      border-radius: 18px;
      padding: 1rem;
    }
    .cover-wrap {
      overflow: hidden;
      border-radius: 14px;
      border: 1px solid var(--line);
      background: #000;
      aspect-ratio: 1;
    }
    .cover-wrap img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    .stack { display: grid; gap: 0.75rem; }
    .row {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
    }
    button, .btn {
      appearance: none;
      border: 1px solid transparent;
      border-radius: 999px;
      padding: 0.55rem 0.95rem;
      font: inherit;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      text-decoration: none;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      color: #04110a;
      background: var(--green);
    }
    button.secondary, .btn.secondary {
      background: transparent;
      color: var(--text);
      border-color: var(--line);
    }
    button:hover, .btn:hover { filter: brightness(1.08); }
    h2 {
      margin: 0;
      font-size: 1rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--muted);
    }
    textarea {
      width: 100%;
      min-height: 14rem;
      resize: vertical;
      border-radius: 12px;
      border: 1px solid var(--line);
      background: #0a101c;
      color: var(--text);
      padding: 0.75rem;
      font-family: "IBM Plex Mono", monospace;
      font-size: 0.8rem;
      line-height: 1.45;
    }
    .hint {
      margin: 0;
      color: var(--muted);
      font-size: 0.95rem;
      line-height: 1.4;
    }
    .toast {
      position: fixed;
      right: 1rem;
      bottom: 1rem;
      background: #052e16;
      color: #bbf7d0;
      border: 1px solid rgba(34,197,94,0.5);
      border-radius: 12px;
      padding: 0.7rem 1rem;
      font-weight: 700;
      letter-spacing: 0.04em;
      opacity: 0;
      transform: translateY(8px);
      transition: 0.2s ease;
      pointer-events: none;
      z-index: 20;
    }
    .toast.show { opacity: 1; transform: none; }
    .error {
      color: #fecaca;
      background: rgba(127, 29, 29, 0.35);
      border: 1px solid rgba(248, 113, 113, 0.35);
      border-radius: 12px;
      padding: 0.75rem 1rem;
      margin-bottom: 1rem;
      font-family: "IBM Plex Mono", monospace;
      font-size: 0.85rem;
    }
  </style>
</head>
<body>
  <main>
    <header>
      <div>
        <h1>Share kit</h1>
        <p class="sub" id="subtitle">Loading this week's package…</p>
      </div>
      <a class="btn secondary" href="https://pakgamedev.com/club">Club board</a>
    </header>

    <div id="error" class="error" hidden></div>

    <div class="grid" id="kit" hidden>
      <section class="panel stack">
        <div class="cover-wrap">
          <img id="cover" alt="Weekly Game Dev Club cover" />
        </div>
        <div class="row">
          <button type="button" id="copyCaption">Copy caption</button>
          <button type="button" class="secondary" id="downloadCover">Download cover</button>
        </div>
        <div class="row">
          <a class="btn secondary" id="coverOpen" href="#" target="_blank" rel="noopener">Open cover</a>
          <button type="button" class="secondary" id="copyCoverUrl">Copy cover URL</button>
        </div>
      </section>

      <section class="panel stack">
        <h2>Caption (all networks)</h2>
        <textarea id="caption" readonly></textarea>

        <h2>Open composer</h2>
        <div class="row" id="openers"></div>

        <p class="hint">
          Paste channels: copy caption, download cover, open the site, attach cover, paste.
          Reddit: open submit, then use the Greasemonkey <strong>Weekly Game Post</strong> button.
        </p>
      </section>
    </div>
  </main>

  <div class="toast" id="toast" role="status"></div>

  <script>
    const COVER_CDN = 'https://pakgamedev.com/gameclubactions/outreach/weekly-cover.png';

    const state = {
      config: {
        linkedinComposeUrl: 'https://www.linkedin.com/feed/?shareActive=true',
        instagramUrl: 'https://www.instagram.com/',
        tiktokUploadUrl: 'https://www.tiktok.com/tiktokstudio/upload',
        youtubeStudioUrl: 'https://studio.youtube.com/',
        redditSubmitUrl: 'https://www.reddit.com/r/PakGameDev/submit/?type=IMAGE',
      },
      caption: '',
      gameName: '',
      coverUrl: './weekly-cover.png',
      coverCdn: COVER_CDN,
    };

    const $ = (id) => document.getElementById(id);

    function toast(msg) {
      const el = $('toast');
      el.textContent = msg;
      el.classList.add('show');
      clearTimeout(toast._t);
      toast._t = setTimeout(() => el.classList.remove('show'), 1800);
    }

    async function copyText(text) {
      await navigator.clipboard.writeText(text);
    }

    function downloadCover() {
      const a = document.createElement('a');
      a.href = state.coverUrl;
      a.download = 'weekly-cover.png';
      document.body.appendChild(a);
      a.click();
      a.remove();
    }

    function openUrl(url) {
      window.open(url, '_blank', 'noopener,noreferrer');
    }

    function addOpener(label, url, { primary = false, prep = false } = {}) {
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.textContent = label;
      if (!primary) btn.classList.add('secondary');
      btn.addEventListener('click', async () => {
        if (prep) {
          await copyText(state.caption);
          downloadCover();
          openUrl(url);
          toast('Caption copied. Cover download started. Composer opened.');
          return;
        }
        openUrl(url);
      });
      $('openers').appendChild(btn);
    }

    async function loadJson(path) {
      const res = await fetch(path + '?cb=' + Date.now());
      if (!res.ok) throw new Error(path + ' HTTP ' + res.status);
      return res.json();
    }

    async function boot() {
      try {
        try {
          state.config = { ...state.config, ...(await loadJson('./share-config.json')) };
        } catch (_) {}

        let linkedin = null;
        let reddit = null;
        try {
          linkedin = await loadJson('./linkedin.json');
        } catch (_) {}
        try {
          reddit = await loadJson('../reddit-auto-post/post.json');
        } catch (_) {
          try {
            reddit = await loadJson('/gameclubactions/reddit-auto-post/post.json');
          } catch (_) {}
        }

        const body = (linkedin && linkedin.text) || (reddit && reddit.body) || '';
        if (!body) throw new Error('No linkedin.json / post.json body found. Run Monday outreach first.');

        state.caption = body.trim();
        state.gameName =
          (linkedin && linkedin.game_name) ||
          (reddit && reddit.game_name) ||
          'this week';
        state.coverCdn =
          (linkedin && linkedin.cover_image) ||
          (reddit && reddit.cover_image) ||
          COVER_CDN;
        state.coverUrl = './weekly-cover.png';

        $('subtitle').textContent = state.gameName + ' · one caption, one cover';
        $('caption').value = state.caption;
        $('cover').src = state.coverUrl + '?cb=' + Date.now();
        $('cover').onerror = () => {
          $('cover').onerror = null;
          $('cover').src = state.coverCdn + '?cb=' + Date.now();
          state.coverUrl = state.coverCdn;
          $('coverOpen').href = state.coverUrl;
        };
        $('coverOpen').href = state.coverUrl;

        $('openers').innerHTML = '';
        addOpener('LinkedIn', state.config.linkedinComposeUrl, { primary: true, prep: true });
        addOpener('Instagram', state.config.instagramUrl, { prep: true });
        addOpener('TikTok', state.config.tiktokUploadUrl, { prep: true });
        addOpener('YouTube', state.config.youtubeStudioUrl, { prep: true });
        addOpener('Reddit IMAGE', state.config.redditSubmitUrl);

        $('kit').hidden = false;
      } catch (err) {
        $('error').hidden = false;
        $('error').textContent = String(err && err.message ? err.message : err);
        $('subtitle').textContent = 'Package missing or unreachable';
      }
    }

    $('copyCaption').addEventListener('click', async () => {
      await copyText(state.caption);
      toast('Caption copied');
    });
    $('downloadCover').addEventListener('click', () => {
      downloadCover();
      toast('Cover download started');
    });
    $('copyCoverUrl').addEventListener('click', async () => {
      await copyText(state.coverCdn);
      toast('Cover URL copied');
    });

    boot();
  </script>
</body>
</html>
