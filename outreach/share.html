<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Game Club share kit | PakGameDev</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #0b1220;
      --panel: #121a2b;
      --line: rgba(34, 197, 94, 0.28);
      --text: #e8eef8;
      --muted: #93a4bf;
      --green: #22c55e;
      --green-dim: #16a34a;
      --warn: #fbbf24;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: Rajdhani, system-ui, sans-serif;
      color: var(--text);
      background:
        radial-gradient(900px 500px at 10% -10%, rgba(34, 197, 94, 0.18), transparent 55%),
        radial-gradient(700px 400px at 100% 0%, rgba(56, 189, 248, 0.1), transparent 50%),
        var(--bg);
    }
    main {
      width: min(1080px, calc(100% - 2rem));
      margin: 0 auto;
      padding: 1.5rem 0 3rem;
    }
    header {
      display: flex;
      flex-wrap: wrap;
      gap: 0.75rem 1.25rem;
      align-items: end;
      justify-content: space-between;
      margin-bottom: 1.25rem;
    }
    h1 {
      margin: 0;
      font-size: clamp(1.8rem, 4vw, 2.6rem);
      letter-spacing: 0.04em;
      text-transform: uppercase;
      line-height: 1;
    }
    .sub {
      margin: 0.35rem 0 0;
      color: var(--muted);
      font-family: "IBM Plex Mono", monospace;
      font-size: 0.85rem;
    }
    .grid {
      display: grid;
      grid-template-columns: minmax(240px, 360px) 1fr;
      gap: 1.25rem;
      align-items: start;
    }
    @media (max-width: 820px) {
      .grid { grid-template-columns: 1fr; }
    }
    .panel {
      background: color-mix(in srgb, var(--panel) 92%, black);
      border: 1px solid var(--line);
      border-radius: 18px;
      padding: 1rem;
    }
    .cover-wrap {
      position: relative;
      overflow: hidden;
      border-radius: 14px;
      border: 1px solid var(--line);
      background: #000;
      aspect-ratio: 1;
    }
    .cover-wrap img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    .cover-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      margin-top: 0.85rem;
    }
    button, .btn {
      appearance: none;
      border: 1px solid transparent;
      border-radius: 999px;
      padding: 0.55rem 0.95rem;
      font: inherit;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      text-decoration: none;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      color: #04110a;
      background: var(--green);
    }
    button.secondary, .btn.secondary {
      background: transparent;
      color: var(--text);
      border-color: var(--line);
    }
    button:hover, .btn:hover { filter: brightness(1.08); }
    button:disabled {
      opacity: 0.45;
      cursor: not-allowed;
      filter: none;
    }
    .channels { display: grid; gap: 0.75rem; }
    .channel {
      display: grid;
      gap: 0.65rem;
      padding: 0.9rem;
      border-radius: 14px;
      border: 1px solid var(--line);
      background: rgba(255,255,255,0.02);
    }
    .channel-top {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      align-items: center;
      justify-content: space-between;
    }
    .channel h2 {
      margin: 0;
      font-size: 1.15rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }
    .channel-actions { display: flex; flex-wrap: wrap; gap: 0.4rem; }
    textarea {
      width: 100%;
      min-height: 7.5rem;
      resize: vertical;
      border-radius: 12px;
      border: 1px solid var(--line);
      background: #0a101c;
      color: var(--text);
      padding: 0.75rem;
      font-family: "IBM Plex Mono", monospace;
      font-size: 0.8rem;
      line-height: 1.45;
    }
    .toast {
      position: fixed;
      right: 1rem;
      bottom: 1rem;
      background: #052e16;
      color: #bbf7d0;
      border: 1px solid rgba(34,197,94,0.5);
      border-radius: 12px;
      padding: 0.7rem 1rem;
      font-weight: 700;
      letter-spacing: 0.04em;
      opacity: 0;
      transform: translateY(8px);
      transition: 0.2s ease;
      pointer-events: none;
      z-index: 20;
    }
    .toast.show { opacity: 1; transform: none; }
    .error {
      color: #fecaca;
      background: rgba(127, 29, 29, 0.35);
      border: 1px solid rgba(248, 113, 113, 0.35);
      border-radius: 12px;
      padding: 0.75rem 1rem;
      margin-bottom: 1rem;
      font-family: "IBM Plex Mono", monospace;
      font-size: 0.85rem;
    }
    .hint {
      margin: 0.85rem 0 0;
      color: var(--muted);
      font-size: 0.95rem;
      line-height: 1.4;
    }
    .one-shot {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      margin-bottom: 1rem;
    }
  </style>
</head>
<body>
  <main>
    <header>
      <div>
        <h1>Share kit</h1>
        <p class="sub" id="subtitle">Loading this week's package…</p>
      </div>
      <a class="btn secondary" href="https://pakgamedev.com/club">Club board</a>
    </header>

    <div id="error" class="error" hidden></div>

    <div class="one-shot" id="oneShot" hidden>
      <button type="button" id="doLinkedIn">LinkedIn: copy + cover + open</button>
      <button type="button" id="doIg" class="secondary">IG/TikTok: copy + cover + open IG</button>
      <button type="button" id="downloadCover" class="secondary">Download cover only</button>
    </div>

    <div class="grid" id="kit" hidden>
      <section class="panel">
        <div class="cover-wrap">
          <img id="cover" alt="Weekly Game Dev Club cover" />
        </div>
        <div class="cover-actions">
          <a class="btn secondary" id="coverOpen" href="#" target="_blank" rel="noopener">Open cover</a>
          <button type="button" class="secondary" id="copyCoverUrl">Copy cover URL</button>
        </div>
        <p class="hint">Flow: hit a one-shot above, paste into the composer that opens, attach the downloaded cover if the site did not keep it.</p>
      </section>

      <section class="channels panel" id="channels"></section>
    </div>
  </main>

  <div class="toast" id="toast" role="status"></div>

  <script>
    const COVER_FALLBACK = './weekly-cover.png';
    const COVER_CDN = 'https://pakgamedev.com/gameclubactions/outreach/weekly-cover.png';

    const state = {
      config: {
        linkedinComposeUrl: 'https://www.linkedin.com/feed/?shareActive=true',
        instagramUrl: 'https://www.instagram.com/',
        tiktokUploadUrl: 'https://www.tiktok.com/tiktokstudio/upload',
        youtubeStudioUrl: 'https://studio.youtube.com/',
      },
      linkedin: '',
      short: '',
      youtube: '',
      gameName: '',
      coverUrl: COVER_FALLBACK,
      coverCdn: COVER_CDN,
    };

    const $ = (id) => document.getElementById(id);

    function toast(msg) {
      const el = $('toast');
      el.textContent = msg;
      el.classList.add('show');
      clearTimeout(toast._t);
      toast._t = setTimeout(() => el.classList.remove('show'), 1800);
    }

    async function copyText(text) {
      await navigator.clipboard.writeText(text);
    }

    function downloadCover() {
      const a = document.createElement('a');
      a.href = state.coverUrl;
      a.download = 'weekly-cover.png';
      document.body.appendChild(a);
      a.click();
      a.remove();
    }

    function openUrl(url) {
      window.open(url, '_blank', 'noopener,noreferrer');
    }

    async function oneShot({ text, open }) {
      await copyText(text);
      downloadCover();
      openUrl(open);
      toast('Copied. Cover download started. Composer opened.');
    }

    function channelCard({ id, title, text, openUrl: target, openLabel }) {
      const wrap = document.createElement('article');
      wrap.className = 'channel';
      wrap.innerHTML = `
        <div class="channel-top">
          <h2>${title}</h2>
          <div class="channel-actions">
            <button type="button" data-copy="${id}">Copy</button>
            <button type="button" class="secondary" data-go="${id}">${openLabel}</button>
            <button type="button" class="secondary" data-all="${id}">Copy + cover + open</button>
          </div>
        </div>
        <textarea readonly id="text-${id}"></textarea>
      `;
      wrap.querySelector(`#text-${id}`).value = text;
      wrap.querySelector(`[data-copy="${id}"]`).addEventListener('click', async () => {
        await copyText(text);
        toast(`${title} caption copied`);
      });
      wrap.querySelector(`[data-go="${id}"]`).addEventListener('click', () => openUrl(target));
      wrap.querySelector(`[data-all="${id}"]`).addEventListener('click', () =>
        oneShot({ text, open: target })
      );
      return wrap;
    }

    function shortFromBody(body) {
      return String(body || '')
        .replace(/\n{2,}/g, '\n')
        .replace(/This week's Discord thread:/g, 'Discuss:')
        .replace(/^Join Discord:.*$/m, '')
        .trim();
    }

    async function loadJson(path) {
      const res = await fetch(path + '?cb=' + Date.now());
      if (!res.ok) throw new Error(path + ' HTTP ' + res.status);
      return res.json();
    }

    async function boot() {
      try {
        try {
          state.config = { ...state.config, ...(await loadJson('./share-config.json')) };
        } catch (_) {}

        let linkedin = null;
        let reddit = null;
        try {
          linkedin = await loadJson('./linkedin.json');
        } catch (_) {}
        try {
          reddit = await loadJson('../reddit-auto-post/post.json');
        } catch (_) {
          try {
            reddit = await loadJson('/gameclubactions/reddit-auto-post/post.json');
          } catch (_) {}
        }

        const body = (linkedin && linkedin.text) || (reddit && reddit.body) || '';
        if (!body) throw new Error('No linkedin.json / post.json body found. Run Monday outreach first.');

        state.linkedin = body.trim();
        state.short = shortFromBody(body);
        state.youtube = state.short;
        state.gameName =
          (linkedin && linkedin.game_name) ||
          (reddit && reddit.game_name) ||
          'this week';
        state.coverCdn =
          (linkedin && linkedin.cover_image) ||
          (reddit && reddit.cover_image) ||
          COVER_CDN;
        state.coverUrl = './weekly-cover.png';

        $('subtitle').textContent = state.gameName + ' · paste kit for LinkedIn / IG / TikTok / YouTube';
        $('cover').src = state.coverUrl + '?cb=' + Date.now();
        $('cover').onerror = () => {
          $('cover').onerror = null;
          $('cover').src = state.coverCdn + '?cb=' + Date.now();
          state.coverUrl = state.coverCdn;
          $('coverOpen').href = state.coverUrl;
        };
        $('coverOpen').href = state.coverUrl;

        const channels = $('channels');
        channels.innerHTML = '';
        channels.append(
          channelCard({
            id: 'linkedin',
            title: 'LinkedIn',
            text: state.linkedin,
            openUrl: state.config.linkedinComposeUrl,
            openLabel: 'Open LinkedIn',
          }),
          channelCard({
            id: 'ig',
            title: 'Instagram',
            text: state.short,
            openUrl: state.config.instagramUrl,
            openLabel: 'Open Instagram',
          }),
          channelCard({
            id: 'tiktok',
            title: 'TikTok',
            text: state.short,
            openUrl: state.config.tiktokUploadUrl,
            openLabel: 'Open TikTok upload',
          }),
          channelCard({
            id: 'youtube',
            title: 'YouTube',
            text: state.youtube,
            openUrl: state.config.youtubeStudioUrl,
            openLabel: 'Open YouTube Studio',
          })
        );

        $('kit').hidden = false;
        $('oneShot').hidden = false;
      } catch (err) {
        $('error').hidden = false;
        $('error').textContent = String(err && err.message ? err.message : err);
        $('subtitle').textContent = 'Package missing or unreachable';
      }
    }

    $('doLinkedIn').addEventListener('click', () =>
      oneShot({ text: state.linkedin, open: state.config.linkedinComposeUrl })
    );
    $('doIg').addEventListener('click', () =>
      oneShot({ text: state.short, open: state.config.instagramUrl })
    );
    $('downloadCover').addEventListener('click', () => {
      downloadCover();
      toast('Cover download started');
    });
    $('copyCoverUrl').addEventListener('click', async () => {
      await copyText(state.coverCdn);
      toast('Cover URL copied');
    });

    boot();
  </script>
</body>
</html>
